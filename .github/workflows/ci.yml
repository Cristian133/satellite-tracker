name: CI

# Lint + tests unitarios + build de imagen Docker en cada push de cualquier
# rama (mismos checks que el pre-commit local, más el build real de la
# imagen Docker de cada servicio — el runner de GitHub Actions siempre tiene
# Docker disponible, a diferencia del entorno local).
#
# El deploy a producción NO ocurre en cada push: solo se dispara al publicar
# un Release en GitHub (evento `release: published`), como gate manual antes
# de producción. Los jobs backend/frontend (lint+tests+build) vuelven a
# correr también en ese evento, para validar el commit exacto que apunta el
# Release antes de deployarlo.
on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      - name: Tests unitarios (pytest)
        run: python -m pytest -q

      - name: Build de la imagen Docker
        run: docker build -t satellite-tracker-backend:ci .

  deploy-backend:
    name: Deploy backend a Fly.io
    needs: backend
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: flyctl deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # jsdom (usado por Vitest) trae undici@^8.9.0, que exige Node >=22.22.2
      # o >=24.15.0; el frontend/Dockerfile usa node:20-alpine, pero eso solo
      # corre `npm run dev`, nunca los tests, así que no hace falta que
      # coincida con la versión usada acá.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests unitarios (vitest)
        run: npm test

      - name: Build de producción (tsc + vite)
        run: npm run build

      - name: Build de la imagen Docker
        run: docker build -t satellite-tracker-frontend:ci .

  deploy-frontend:
    name: Deploy frontend a Vercel
    needs: frontend
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # Deploy Hook en vez de la CLI + token: no requiere autenticar un
      # usuario, solo dispara un build de la rama configurada en el hook
      # (main) con el código ya en el repo remoto de Vercel.
      - name: Disparar deploy vía Deploy Hook
        run: |
          response=$(curl -sS -w '\n%{http_code}' -X POST "$DEPLOY_HOOK_VERCEL")
          status="${response##*$'\n'}"
          body="${response%$'\n'"$status"}"
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "Deploy Hook respondió $status" >&2
            exit 1
          fi
        env:
          DEPLOY_HOOK_VERCEL: ${{ secrets.DEPLOY_HOOK_VERCEL }}
