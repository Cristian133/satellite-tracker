name: CI

# Corre lo mismo que el pre-commit local (lint + tests unitarios) en cada
# push de cualquier rama, más el build real de la imagen Docker de cada
# servicio (el runner de GitHub Actions siempre tiene Docker disponible, a
# diferencia del entorno local).
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      - name: Tests unitarios (pytest)
        run: python -m pytest -q

      - name: Build de la imagen Docker
        run: docker build -t satellite-tracker-backend:ci .

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests unitarios (vitest)
        run: npm test

      - name: Build de producción (tsc + vite)
        run: npm run build

      - name: Build de la imagen Docker
        run: docker build -t satellite-tracker-frontend:ci .
